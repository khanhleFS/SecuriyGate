version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database (Primary DB cho hệ thống)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sep-postgres
    restart: always
    environment:
      POSTGRES_DB: securitygate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securitygate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis (Tùy chọn: Dùng lưu Blacklist JWT / Session / Cache)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sep-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # -------------------------------------------------------------
  # Backend Spring Boot App
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sep-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securitygate_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
