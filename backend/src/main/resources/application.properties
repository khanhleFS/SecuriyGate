spring.application.name=Backend
server.port=${SERVER_PORT:8080}

# Active profile: 'local' (MSSQL) by default, or 'prod' (PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================================================================
# JWT Configuration
# ===================================================================
# Chuỗi bí mật Base64-encoded độ dài tối thiểu 256-bit
jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRqd3RzZWNyZXRrZXlmb3JwcmludGh1YjNkeXl5eXl5eXl5eXl5eXl5eXl5}
# Access token: 15 phút = 900.000 ms
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
# Refresh token: 7 ngày = 604.800.000 ms
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===================================================================
# Redis Configuration (Cache, Refresh Token & Blacklist)
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===================================================================
# Mail Configuration (SMTP)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===================================================================
# Swagger / OpenAPI UI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
