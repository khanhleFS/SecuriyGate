# ===================================================================
# Database Configuration (MSSQL - Local Development)
# Map chu?n v?i DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD trong .env.local
# ===================================================================
spring.datasource.url=${MSSQL_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:securitygate_db};encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
