# ===================================================================
# Database Configuration (MSSQL - Local Development)
# ===================================================================
spring.datasource.url=${MSSQL_URL:jdbc:sqlserver://localhost:1433;databaseName=securitygate_db;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${MSSQL_USERNAME:sa}
spring.datasource.password=${MSSQL_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
