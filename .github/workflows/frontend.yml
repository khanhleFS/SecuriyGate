name: Frontend Monorepo CI/CD (Turborepo)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - "!frontend/apps/mobile/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - "!frontend/apps/mobile/**"
      - ".github/workflows/frontend.yml"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Lint Monorepo
        run: npm run lint

      # Mở comment khi dự án có viết unit test
      # - name: Run Tests
      #   run: npm run test

      - name: Build Web Application
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
        run: npm run build -- --filter=web