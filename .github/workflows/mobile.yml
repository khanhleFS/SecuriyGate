name: Mobile CI/CD (Flutter)

on:
  push:
    branches: [ "main" ]
    paths:
      - "mobile/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "mobile/**"

jobs:
  flutter-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java (Yêu cầu cho Android SDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

  flutter-build-apk:
    name: Build Release APK
    needs: flutter-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release mode)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14