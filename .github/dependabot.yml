version: 2
updates:
  # Cập nhật phụ thuộc GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Cập nhật thư viện Maven cho Backend (Java Spring Boot)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Cập nhật thư viện npm cho Frontend Web (Next.js)
  - package-ecosystem: "npm"
    directory: "/frontend/web"
    schedule:
      interval: "weekly"

  # Cập nhật thư viện pub cho Frontend Mobile (Flutter/Dart)
  - package-ecosystem: "pub"
    directory: "/frontend/mobile"
    schedule:
      interval: "weekly"

  # Quét base image Dockerfile cho Backend
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Quét base image Dockerfile cho Frontend Web
  - package-ecosystem: "docker"
    directory: "/frontend/web"
    schedule:
      interval: "weekly"

  # Quét base image Dockerfile cho Frontend Mobile
  - package-ecosystem: "docker"
    directory: "/frontend/mobile"
    schedule:
      interval: "weekly"
